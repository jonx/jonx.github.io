<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} - John Knipper</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#07040F" />
    <meta property="og:title" content="{{TITLE}} - John Knipper" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta
      property="og:image"
      content="https://www.jkn.me/blog/{{SLUG}}/assets/{{HERO_IMAGE}}"
    />
    <link rel="icon" type="image/png" href="/paw/assets/icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="John Knipper"
      href="/blog/feed.xml"
    />
    <link rel="stylesheet" href="/blog/blog.css" />
  </head>
  <body class="post">
    <main class="wrap">
      <a class="back" href="/blog/"><span class="arrow">←</span> All posts</a>

      <header class="post-head">
        <span class="meta">{{DATE}} · {{CATEGORY}}</span>
        <h1>{{TITLE}}</h1>
      </header>

      <article class="prose">
        {{BODY}}
        <!-- Every post carries at least one <img> (the hero from assets/). -->
      </article>

      <footer class="site-footer">
        <span>© 2026 John Knipper</span>
        <span class="dot">·</span>
        <a href="/blog/">All posts</a>
        <span class="dot">·</span>
        <a href="https://github.com/jonx" target="_blank" rel="noopener"
          >GitHub</a
        >
      </footer>
    </main>
  </body>
</html>
